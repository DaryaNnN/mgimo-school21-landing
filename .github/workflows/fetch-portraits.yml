name: Download official portraits for review
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download public images
        run: python3 scripts/download-teacher-portraits.py
      - uses: actions/upload-artifact@v4
        with:
          name: official-teacher-portraits
          path: portrait-downloads
          retention-days: 7
